# Netlify Configuration File

[build]
  publish = "."
  functions = "netlify/functions"
  
# Form Settings - Spam Protection
[build.environment]
  # Enable stricter spam filtering
  NETLIFY_FORMS_SPAM_SCORE_THRESHOLD = "50"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache Static Assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Friendly redirect for the Meta webhook endpoint
[[redirects]]
  from = "/api/meta-webhook"
  to   = "/.netlify/functions/meta-webhook"
  status = 200
